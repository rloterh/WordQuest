<svg xmlns="http://www.w3.org/2000/svg" width="690" height="119" viewBox="0 0 690 119">
  <title>G pearl answer surface candidate; soft bevel and contact shadow, no baked text</title>
  <defs>
    <linearGradient id="pearl" x1="0" y1="4" x2="0" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ebe9ff"/><stop offset=".5" stop-color="#dedcff"/><stop offset="1" stop-color="#d2d2ff"/>
    </linearGradient>
    <radialGradient id="softLight" cx="200" cy="20" r="230" gradientTransform="translate(0 12) scale(1 .7)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".31"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilacWash" cx="590" cy="58" r="250" gradientTransform="translate(0 17) scale(1 .7)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c3c1ff" stop-opacity=".13"/><stop offset="1" stop-color="#c3c1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="4" x2="0" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".55" stop-color="#e5e1ff"/><stop offset=".92" stop-color="#f5f2ff"/><stop offset="1" stop-color="#fcfaff"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="6" x2="0" y2="97" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".50"/><stop offset=".18" stop-color="#ffffff" stop-opacity=".10"/><stop offset=".52" stop-color="#ffffff" stop-opacity="0"/><stop offset=".84" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".45"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-60%" width="120%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4.5"/></filter>
    <filter id="contact" x="-5%" y="-20%" width="110%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="edge" x="-5%" y="-20%" width="110%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation=".7"/></filter>
  </defs>
  <rect x="12" y="10" width="666" height="95" rx="44" fill="#6c65b0" fill-opacity=".31" filter="url(#shadow)"/>
  <rect x="12.75" y="7.75" width="664.5" height="93.5" rx="43.25" fill="#5c60ae" fill-opacity=".38" filter="url(#contact)"/>
  <rect x="12.75" y="4.75" width="664.5" height="93.5" rx="43.25" fill="url(#pearl)"/>
  <rect x="12.75" y="4.75" width="664.5" height="93.5" rx="43.25" fill="url(#softLight)"/>
  <rect x="12.75" y="4.75" width="664.5" height="93.5" rx="43.25" fill="url(#lilacWash)"/>
  <rect x="14" y="6" width="662" height="91" rx="42" fill="none" stroke="url(#bevel)" stroke-width="2" filter="url(#edge)"/>
  <rect x="12.75" y="4.75" width="664.5" height="93.5" rx="43.25" fill="none" stroke="url(#rim)" stroke-width="2.2"/>
</svg>
