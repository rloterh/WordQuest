    <circle cx="40" cy="75" r="2.5" fill="url(#glint)"/>
    <circle cx="244" cy="85" r="2" fill="url(#glint)" opacity=".55"/>
    <g fill="#f8efff" opacity=".4"><circle cx="36" cy="70" r=".5"/><circle cx="50" cy="82" r=".45"/><circle cx="254" cy="60" r=".5"/></g>
    <rect x="9.2" y="8.2" width="268.6" height="96.6" rx="48.3" fill="none" stroke="url(#bevel)" stroke-width="3.2" filter="url(#edge)"/>
  </g>
  <rect x="7" y="6" width="273" height="101" rx="50.5" fill="none" stroke="url(#edgeLight)" stroke-width="1.2"/>
