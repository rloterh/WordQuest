  <rect x="1.5" y="3" width="284" height="108" rx="54" fill="#725685" fill-opacity=".4"/>
  <rect x="1.5" y="1.5" width="284" height="108" rx="54" fill="#b38b6d" stroke="#a17c69" stroke-width="1.3"/>
  <rect x="3.5" y="3.5" width="280" height="104" rx="52" fill="#ac98ca" stroke="url(#gold)" stroke-width="3.4"/>
  <rect x="3.5" y="3.5" width="280" height="104" rx="52" fill="none" stroke="url(#rimCrest)" stroke-width=".9"/>
  <rect x="5.5" y="5" width="276" height="103" rx="51.5" fill="#f9f1ff"/>
  <rect x="7" y="6" width="273" height="101" rx="50.5" fill="url(#pearl)"/>
  <g clip-path="url(#face)">
