    <rect x="7" y="6" width="273" height="101" fill="url(#lowerLight)"/>
    <path d="M16 52 Q16 24 42 13 Q49 11 57 11 M231 11 Q257 15 268 39" fill="none" stroke="#fff6ff" stroke-width="5" opacity=".55" filter="url(#edge)"/>
    <path d="M18 66 Q25 94 47 101 M239 102 Q260 94 270 72" fill="none" stroke="#d6ccfa" stroke-width="4" opacity=".5" filter="url(#edge)"/>
