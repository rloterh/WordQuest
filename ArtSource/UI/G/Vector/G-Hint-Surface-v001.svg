<svg xmlns="http://www.w3.org/2000/svg" width="287" height="113" viewBox="0 0 287 113">
  <title>G Hint pearl surface candidate; warm gold and curved lilac glass, no label or bulb</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="2" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0de"/><stop offset=".15" stop-color="#e5c7ac"/><stop offset=".38" stop-color="#b8977a"/><stop offset=".62" stop-color="#97745a"/><stop offset=".85" stop-color="#d7b69a"/><stop offset="1" stop-color="#ffe5b2"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="6" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eadcfb"/><stop offset=".24" stop-color="#d3c8fc"/><stop offset=".5" stop-color="#bfb3f4"/><stop offset=".75" stop-color="#ada6e9"/><stop offset=".94" stop-color="#a195e3"/><stop offset="1" stop-color="#bcb2f3"/>
    </linearGradient>
    <radialGradient id="faceLight" cx="144" cy="26" r="132" gradientTransform="translate(0 8) scale(1 .7)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".4"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lowerLight" cx="150" cy="84" r="131" gradientTransform="translate(0 33.6) scale(1 .6)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7deff" stop-opacity=".22"/><stop offset="1" stop-color="#e7deff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeLight" x1="0" y1="6" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".17" stop-color="#f5eeff"/><stop offset=".48" stop-color="#d1c1e9"/><stop offset=".8" stop-color="#e6d9fa"/><stop offset="1" stop-color="#fff5ff"/>
    </linearGradient>
    <linearGradient id="rimCrest" x1="0" y1="3" x2="0" y2="109" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaf2"/><stop offset=".18" stop-color="#fff2dd"/><stop offset=".5" stop-color="#d8b399"/><stop offset=".85" stop-color="#f0cfad"/><stop offset="1" stop-color="#fff3d3"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="9" x2="0" y2="103" gradientUnits="userSpaceOnUse">
