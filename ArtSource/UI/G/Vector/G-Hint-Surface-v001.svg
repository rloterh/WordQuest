    </linearGradient>
    <radialGradient id="glint"><stop stop-color="#fff6ff" stop-opacity=".75"/><stop offset="1" stop-color="#f7e8ff" stop-opacity="0"/></radialGradient>
    <clipPath id="face"><rect x="7" y="6" width="273" height="101" rx="50.5"/></clipPath>
    <filter id="edge" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.1"/></filter>
    <filter id="cloud" x="-30%" y="-70%" width="160%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.3"/></filter>
