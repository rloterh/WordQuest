  <rect x="6.2" y="6.2" width="375.6" height="98.6" rx="49.3" fill="#503888" stroke="#f3e3d6" stroke-width="1.1"/>
  <rect x="8" y="9" width="372" height="95" rx="46.5" fill="url(#violet)"/>
