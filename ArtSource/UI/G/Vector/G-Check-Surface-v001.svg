<svg xmlns="http://www.w3.org/2000/svg" width="388" height="113" viewBox="0 0 388 113">
  <title>G Check surface candidate; violet face and pale gold, no baked label or icon</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="2" x2="0" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff4de"/><stop offset=".14" stop-color="#d8b78f"/><stop offset=".46" stop-color="#fff0c9"/><stop offset=".72" stop-color="#b99870"/><stop offset=".94" stop-color="#f4d7ac"/><stop offset="1" stop-color="#fff1d6"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="8" x2="0" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9479ef"/><stop offset=".19" stop-color="#6243d7"/><stop offset=".53" stop-color="#30238d"/><stop offset=".78" stop-color="#302693"/><stop offset=".93" stop-color="#3b35b0"/><stop offset="1" stop-color="#6552cf"/>
    </linearGradient>
    <linearGradient id="edgeLight" x1="0" y1="8" x2="0" y2="106" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9dfff"/><stop offset=".12" stop-color="#bfb2ff"/><stop offset=".42" stop-color="#8a70db"/><stop offset=".74" stop-color="#7562cc"/><stop offset="1" stop-color="#b4a4f4"/>
    </linearGradient>
    <radialGradient id="upperWash" cx="315" cy="18" r="80" gradientTransform="translate(0 7.2) scale(1 .6)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b390ff" stop-opacity=".46"/><stop offset="1" stop-color="#ad88ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leftWash" cx="49" cy="97" r="68" gradientTransform="translate(0 19.4) scale(1 .8)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#667bff" stop-opacity=".58"/><stop offset="1" stop-color="#7180ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightWash" cx="344" cy="95" r="60" gradientTransform="translate(0 19) scale(1 .8)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6274f7" stop-opacity=".36"/><stop offset="1" stop-color="#6274f7" stop-opacity="0"/>
    </radialGradient>
