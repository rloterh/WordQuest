    <clipPath id="face"><rect x="8" y="9" width="372" height="95" rx="46.5"/></clipPath>
    <linearGradient id="bevel" x1="0" y1="10" x2="0" y2="103" gradientUnits="userSpaceOnUse"><stop stop-color="#fff5ff" stop-opacity=".60"/><stop offset=".12" stop-color="#d7bdff" stop-opacity=".24"/><stop offset=".38" stop-color="#bdb4ff" stop-opacity="0"/><stop offset=".76" stop-color="#817aff" stop-opacity=".08"/><stop offset="1" stop-color="#a8aaff" stop-opacity=".60"/></linearGradient>
    <filter id="softEdge" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.8"/></filter>
    <filter id="rimSoft" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation=".5"/></filter>
