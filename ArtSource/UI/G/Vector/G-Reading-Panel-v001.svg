<svg xmlns="http://www.w3.org/2000/svg" width="790" height="1140" viewBox="0 0 790 1140">
  <title>G editable reading panel candidate; blank pearl surface</title>
  <defs>
    <path id="panel" d="M395 17 C376 45 291 59 166 68 C131 69 109 84 96 118 C43 131 18 155 18 206 L18 1010 C18 1047 32 1065 74 1080 C154 1104 261 1107 395 1108 C529 1107 636 1104 716 1080 C758 1065 772 1047 772 1010 L772 206 C772 155 747 131 694 118 C681 84 659 69 624 68 C499 59 414 45 395 17 Z"/>
    <clipPath id="inside"><use href="#panel"/></clipPath>
    <linearGradient id="pearl" x1="0" y1="17" x2="0" y2="1108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5eef8"/><stop offset=".55" stop-color="#f2e6f8"/><stop offset="1" stop-color="#f1e3f1"/>
    </linearGradient>
    <radialGradient id="ivory" cx="202" cy="375" r="440" gradientTransform="translate(0 -210) scale(1 1.55)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8eb" stop-opacity=".38"/><stop offset="1" stop-color="#fff8eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilac" cx="674" cy="463" r="410" gradientTransform="translate(0 -230) scale(1 1.5)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cfc0ed" stop-opacity=".22"/><stop offset="1" stop-color="#cfc0ed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="18" y1="17" x2="772" y2="1108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4a67b"/><stop offset=".25" stop-color="#d8b99a"/><stop offset=".56" stop-color="#c0a28b"/><stop offset=".85" stop-color="#ddbea0"/><stop offset="1" stop-color="#c4a67b"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".028 .042" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <use href="#panel" transform="translate(0 3)" fill="#5d496d" opacity=".18" filter="url(#shadow)"/>
  <use href="#panel" fill="url(#pearl)"/>
  <g clip-path="url(#inside)">
    <rect width="790" height="1140" fill="url(#ivory)"/>
    <rect width="790" height="1140" fill="url(#lilac)"/>
    <rect width="790" height="1140" filter="url(#grain)" opacity=".035"/>
    <use href="#panel" fill="none" stroke="#8b789c" stroke-width="10" opacity=".18"/>
  </g>
  <use href="#panel" fill="none" stroke="url(#gold)" stroke-width="5.5" stroke-linejoin="round"/>
  <use href="#panel" fill="none" stroke="#fff9ed" stroke-width="2.1" stroke-linejoin="round"/>
</svg>
